# Giao diện web React (thư mục web/) trên Netlify. Máy chủ OGK vẫn chạy trên máy của bố mẹ;
# trang Netlify gọi API của máy đó bằng Bearer token (không dùng cookie khác nguồn).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_REMOTE = "1"
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
